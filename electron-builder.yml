appId: com.antiprofiles.app
productName: AntiProfiles
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!tests/*'
asarUnpack:
  - '**/*.node'
  - resources/**

# ── macOS Packaging ──
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  minimumSystemVersion: '11.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  artifactName: 'AntiProfiles-macOS-${arch}.${ext}'
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows Packaging ──
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: 'AntiProfiles-Windows-x64.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AntiProfiles
  uninstallDisplayName: AntiProfiles Anti-Detect Browser
  runAfterFinish: true

npmRebuild: true

# ── Linux Packaging ──
linux:
  icon: resources/icon.png
  category: Utility;Development;Network;
  synopsis: Professional Anti-Detect Browser Profile & Privacy Management Application
  maintainer: AntiProfiles Support <support@antiprofiles.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  artifactName: 'AntiProfiles-Linux-${arch}.${ext}'

publish:
  provider: generic
  url: https://releases.profilevault.local/updates

# ──────────────────────────────────────────────
# AntiProfiles aaPanel Nginx PHP Configuration
# Add this inside your Site Settings -> URL rewrite / Nginx Configuration in aaPanel
# ──────────────────────────────────────────────

# Maximum body size for installer uploads (up to 1 GB)
client_max_body_size 1024m;

# FastCGI timeout settings for large file streaming
fastcgi_connect_timeout 300s;
fastcgi_send_timeout 600s;
fastcgi_read_timeout 600s;
fastcgi_buffer_size 128k;
fastcgi_buffers 8 128k;
fastcgi_busy_buffers_size 256k;
fastcgi_temp_file_write_size 256k;

# Main Web App & API Router
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Accelerated Static Installer File Downloads (Zero-Copy Kernel Streaming)
location /releases/ {
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    add_header Content-Disposition 'attachment';
    add_header X-Accel-Buffering 'no';
    add_header Cache-Control 'public, must-revalidate, max-age=3600';
}

# Deny access to sensitive files
location ~* \.(sql|sqlite|db|env|log)$ {
    deny all;
}

location ~ /(config\.php|db\.php|database\.sql) {
    deny all;
}
